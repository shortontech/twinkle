[package]
name = "twinkle-ui"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Declarative native Rust UI with intrinsic layout and native presentation"
readme = "README.md"
keywords = ["gui", "ui", "desktop", "declarative"]
categories = ["gui"]

[features]
pipeline-attribution = ["dep:serde_json"]
redux = ["dep:twinkle-redux"]
default = ["native-controller", "gpu-presenter"]
native-controller = ["dep:gilrs", "twinkle-input/gilrs"]
gpu-presenter = ["dep:bytemuck", "dep:pollster", "dep:raw-window-handle", "dep:wgpu"]

[dependencies]
serde_json = { workspace = true, optional = true }
cosmic-text.workspace = true
gilrs = { workspace = true, optional = true }
image.workspace = true
twinkle-input = { version = "0.2.0", path = "../twinkle-input", features = ["winit"] }
twinkle-render-assets = { version = "0.2.0", path = "../twinkle-render-assets" }
twinkle-macros = { version = "0.2.0", path = "../twinkle-macros" }
twinkle-redux = { version = "0.1.0", path = "../twinkle-redux", optional = true }
softbuffer.workspace = true
winit.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "image-data"] }
smallvec.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62.2"

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
toml.workspace = true
