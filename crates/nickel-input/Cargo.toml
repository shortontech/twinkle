[package]
name = "nickel-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral input vocabulary and shortcut recognition for Nickel UI applications"

[features]
default = []
sdl = ["dep:sdl3"]
winit = ["dep:winit"]
gilrs = ["dep:gilrs"]

[dependencies]
sdl3 = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
