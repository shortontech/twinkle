[package]
name = "twinkle-jsx-runtime"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/twinkle-jsx-runtime"
