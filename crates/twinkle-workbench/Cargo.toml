[package]
name = "twinkle-workbench"
default-run = "twinkle-workbench"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Independent component fixtures and native preview tools for Twinkle"

[[bin]]
name = "twinkle-jsx-preview"
path = "src/bin/twinkle_jsx_preview.rs"
required-features = ["jsx"]

[features]
default = []
jsx = ["dep:twinkle-jsx-runtime", "dep:twinkle-presentation", "dep:twinkle-protocol", "dep:serde_json"]

[dependencies]
twinkle-jsx-runtime = { path = "../twinkle-jsx-runtime", optional = true }
twinkle-presentation = { path = "../twinkle-presentation", features = ["jsx"], optional = true }
twinkle-protocol = { path = "../twinkle-protocol", optional = true }
serde_json = { workspace = true, optional = true }
twinkle = { path = "../twinkle" }
twinkle-testkit = { path = "../twinkle-testkit" }
image.workspace = true

[dev-dependencies]
twinkle-input = { path = "../twinkle-input" }
serde.workspace = true
toml.workspace = true
