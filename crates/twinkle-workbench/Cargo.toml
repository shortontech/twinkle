[package]
name = "twinkle-workbench"
default-run = "twinkle-workbench"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/twinkle-workbench"
description = "Independent component fixtures and native preview tools for Twinkle"
publish = false

[[bin]]
name = "twinkle-jsx-preview"
path = "src/bin/twinkle_jsx_preview.rs"
required-features = ["jsx"]

[features]
default = []
jsx = ["dep:twinkle-jsx-runtime", "dep:twinkle-presentation", "dep:twinkle-protocol", "dep:serde_json"]
charts = ["dep:twinkle-charts", "twinkle-presentation?/charts"]

[dependencies]
twinkle-jsx-runtime = { version = "0.2.0", path = "../twinkle-jsx-runtime", optional = true }
twinkle-presentation = { version = "0.2.0", path = "../twinkle-presentation", features = ["jsx"], optional = true }
twinkle-protocol = { version = "0.2.0", path = "../twinkle-protocol", optional = true }
serde_json = { workspace = true, optional = true }
twinkle = { package = "twinkle-ui", version = "0.2.0", path = "../twinkle" }
twinkle-testkit = { version = "0.2.0", path = "../twinkle-testkit" }
twinkle-charts = { version = "0.1.0", path = "../twinkle-charts", optional = true }
image.workspace = true

[dev-dependencies]
twinkle-input = { version = "0.2.0", path = "../twinkle-input" }
serde.workspace = true
toml.workspace = true
