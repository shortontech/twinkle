[package]
name = "nickel-ui"
version = "0.1.0"
default-run = "nickel-ui"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
plasma-bootstrap = ["dep:wayland-client", "dep:wayland-protocols-plasma"]

[dependencies]
bytemuck.workspace = true
glyphon.workspace = true
image.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
pollster.workspace = true
redb.workspace = true
resvg.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-desktop-entry.workspace = true
freedesktop-icons.workspace = true
shlex.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-protocols-plasma = { workspace = true, features = ["client"], optional = true }

[dev-dependencies]
tempfile = "3.25.0"
