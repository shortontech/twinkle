[package]
name = "nickel-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Declarative native Rust UI with intrinsic layout and SDL presentation"
readme = "README.md"

[dependencies]
nickel-core = { path = "../nickel-core" }
cosmic-text.workspace = true
gilrs.workspace = true
image.workspace = true
nickel-input = { path = "../nickel-input", features = ["gilrs", "sdl"] }
nickel-i18n = { path = "../nickel-i18n" }
ui-declarative-macros = "0.1.0"
sdl3.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
toml.workspace = true
