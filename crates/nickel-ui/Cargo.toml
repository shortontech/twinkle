[package]
name = "nickel-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Declarative native Rust UI with intrinsic layout and native presentation"
readme = "README.md"

[dependencies]
nickel-core = { path = "../nickel-core" }
cosmic-text.workspace = true
gilrs.workspace = true
image.workspace = true
nickel-input = { path = "../nickel-input", features = ["gilrs", "winit"] }
nickel-i18n = { path = "../nickel-i18n" }
nickel-render-assets = { path = "../nickel-render-assets" }
ui-declarative-macros = "0.1.0"
softbuffer.workspace = true
winit.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "image-data"] }
smallvec.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSPasteboard", "NSResponder", "NSTextView", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSGeometry", "NSString", "NSURL"] }
raw-window-handle.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
toml.workspace = true
