[package]
name = "twinkle-presentation"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/twinkle-presentation"
description = "Native presentation adapters and protocol integration for Twinkle"
readme = "README.md"

[dependencies]
twinkle-theme = { version = "0.2.0", path = "../twinkle-theme" }
cssparser = "0.38.0"
image.workspace = true
twinkle-jsx-runtime = { version = "0.2.0", path = "../twinkle-jsx-runtime", optional = true }
twinkle-charts = { version = "0.1.0", path = "../twinkle-charts", optional = true }
twinkle-protocol = { version = "0.2.0", path = "../twinkle-protocol" }
twinkle = { package = "twinkle-ui", version = "0.2.0", path = "../twinkle" }
serde_json.workspace = true

[features]
default = []
jsx = ["dep:twinkle-jsx-runtime"]
charts = ["dep:twinkle-charts"]
jsx-charts = ["jsx", "charts"]

[[example]]
name = "jsx_host"
required-features = ["jsx"]
